exp_name: develop

dataset:
  batch_size: 256
  root_dir: /home/yxz/MyProjects/DATASET/DRO/DRO-HOI-Dataset
  num_workers: 16
  data_name: DRO
  hand_type: shadow
  use_cmap: True

diffusion_cfg:
  diffuse_steps: 40
  lr: 8e-4
  output_dir: /home/yxz/MyProjects/MASH-HOI/mash-hoi/runs/dro-single/exp-shadow-1-correct-cmap-8e-4
  # EDM parameters
  sigma_data: 1.0
  sigma_min: 0.002
  sigma_max: 80.0
  rho: 7.0
  P_mean: -1.2
  P_std: 1.2

model_cfg:
  name: dit_v2_cmap
  d_in: 26
  d_feat: 192
  d_out: 26
  n_blocks: 12
  use_complie: True

mash_cfg:
  mask_dim: 7
  sh_dim: 9
  ortho_dim: 6

trainer:
  fast_dev_run: False
  max_epochs: 1500
  log_dir: /home/yxz/MyProjects/MASH-HOI/mash-hoi/runs/dro-single
  gradient_clip_val: 1.0
  devices: [0, 1, 2]
  limit_test_batches: 1.0
  precision: "16-mixed"
  check_val_every_n_epoch: 500

tester:
  devices: [0]
