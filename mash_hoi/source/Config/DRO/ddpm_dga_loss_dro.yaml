exp_name: exp_ddpm_dga_loss_dro

dataset:
  batch_size: 128
  data_root: /mnt/d/yxz/DATASET/HOI-Dataset/Sphere-CMapDataset
  num_workers: 12  # Reduced from 12 to avoid DDP process overload
  data_name: CMapDataset
  template_mash_root: /mnt/d/yxz/DATASET/template_info

diffusion_cfg:
  diffuse_steps: 1000
  beta_start: 1e-4
  beta_end: 0.02
  lr: 1e-3
  output_dir: /home/yxz/MyProjects/MASH-HOI/mash_hoi/Results/MASH/exp_ddpm_dga_loss_dro

model_cfg:
  name: dit_v3
  d_in: 26  # 22 hand + 4 object_cmap (no hand_cmap)
  d_feat: 192
  d_out: 26  # 22 hand + 4 object_cmap (no hand_cmap)
  n_blocks: 8
  use_complie: True
  use_hand_cmap: False  # Set to True to include hand_cmap (d_in/d_out = 30)

mash_cfg:
  mask_dim: 7
  sh_dim: 9
  ortho_dim: 6
  # Collision loss module parameters
  anchor_num: 256  # Number of MASH anchors 
  mask_degree_max: 3  # Maximum mask degree 
  sh_degree_max: 2  # Maximum spherical harmonics degree 
  sample_phi_num: 8  # Number of phi samples for point cloud generation 
  sample_theta_num: 8  # Number of theta samples for point cloud generation 

loss_cfg:
  loss_type: "fcl"
  lambda_collision: 1.0  # Weight for collision loss
  include_self_intersection: true  # Whether to include hand self-intersection loss
  guidance_scale: 1.0
  guidance_threshold: 0.0
  use_spherical_gaussian: true  # Whether to use spherical Gaussian constraint
  use_multiprocessing: true  # Use multiprocessing for collision detection (fork-safe in DDP, pure CPU operations)
  num_workers: 8  # Number of worker processes for collision detection
  collision_timestep_threshold: 20  # Only compute collision loss when t < this threshold (pred_x0 is more accurate at small t)

trainer:
  fast_dev_run: True
  max_epochs: 300
  log_dir: /home/yxz/MyProjects/MASH-HOI/mash_hoi/runs
  gradient_clip_val: 1.0
  devices: [0]
  limit_test_batches: 1.0
  precision: "32"
  check_val_every_n_epoch: 2000

tester:
  devices: [0]
  # ckpt_path: /data/lym/MASH-HOI/runs/logs/exp_ddpm_fixed_dro/version_6/best_model.ckpt
