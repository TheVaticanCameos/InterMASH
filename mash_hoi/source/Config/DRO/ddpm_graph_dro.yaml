exp_name: exp_ddpm_graph_dro

dataset:
  batch_size: 128
  data_root: /mnt/d/yxz/DATASET/HOI-Dataset/Sphere-CMapDataset
  num_workers: 12
  data_name: GraphCMapDataset
  template_mash_root: /mnt/d/yxz/DATASET/template_info
  knn_cache_dir: null  # Will use {data_root}/.cache/knn_cache by default
  k_neighbors: 8
  precompute_device: "cuda"

diffusion_cfg:
  diffuse_steps: 1000
  beta_start: 1e-4
  beta_end: 0.02
  lr: 1e-3
  output_dir: /mnt/d/yxz/lym29-data/MASH-HOI/exp_ddpm_graph_dro

model_cfg:
  name: dit_v3_graph
  d_in: 26
  d_feat: 192
  d_out: 26
  n_blocks: 8
  latent_dim: 64
  k_neighbors: 8
  knn_bias_scale: 2.0
  use_compile: True

mash_cfg:
  mask_dim: 7
  sh_dim: 9
  ortho_dim: 6
  anchor_num: 256
  mask_degree_max: 3
  sh_degree_max: 2
  sample_phi_num: 8
  sample_theta_num: 8

loss_cfg:
  lambda_collision: 1.0
  lambda_latent: 1.0
  include_self_intersection: true
  guidance_scale: 1.0
  guidance_threshold: 0.0
  use_spherical_gaussian: true
  use_multiprocessing: true
  num_workers: 8
  collision_timestep_threshold: 20

# Edge Weight VAE configuration (optional)
# Set checkpoint_path when VAE is trained
edge_vae_cfg:
  checkpoint_path: /mnt/d/yxz/lym29-data/MASH-HOI/logs-EdgeVAE-DRO/exp_edge_vae/version_3/loss=0.2064-backup.ckpt
  input_dim: 22
  n_anchors: 256
  d_model: 128
  nhead: 4
  num_encoder_layers: 4
  latent_dim: 64
  pos_dim: 64
  phys_dim: 3                         # For RoPE positional encoding
  dropout: 0.1
  # Two-stage decoder config
  row_hidden_dims: [128, 64]          # Stage 1: Column classifier (hand patches)
  col_hidden_dims: [256, 128, 64]     # Stage 2: Row predictor (object patches)

trainer:
  fast_dev_run: False
  max_epochs: 300
  log_dir: /mnt/d/yxz/lym29-data/MASH-HOI/runs
  gradient_clip_val: 1.0
  devices: [2,3,4,5,6,7]
  limit_test_batches: 1.0
  precision: "16-mixed"
  check_val_every_n_epoch: 2000

tester:
  devices: [0]
  # ckpt_path: /path/to/checkpoint.ckpt

