exp_name: exp_ddpm_graph_dgn_no_edgevae

dataset:
  batch_size: 80
  data_root: /mnt/d/yxz/DATASET/HOI-Dataset/Sphere-DexGraspNet/shadow
  num_workers: 4
  data_name: GraphDexGraspNetDataset
  template_mash_path: /mnt/d/yxz/DATASET/template_info/mash_sphere_shadow_template.npy
  knn_cache_dir: null  # Will use {data_root}/.cache/knn_cache by default
  k_neighbors: 8
  precompute_device: "cuda"

diffusion_cfg:
  diffuse_steps: 1000
  beta_start: 1e-4
  beta_end: 0.02
  lr: 2e-3
  output_dir: /home/yxz/MyProjects/MASH-HOI/mash_hoi/Results/MASH/exp_ddpm_graph_dgn_no_edgevae

model_cfg:
  name: dit_v3_graph
  d_in: 26
  d_feat: 192
  d_out: 26
  n_blocks: 18
  latent_dim: 64
  k_neighbors: 8
  knn_bias_scale: 2.0
  use_compile: True

mash_cfg:
  mask_dim: 7
  sh_dim: 9
  ortho_dim: 6
  cmap_dim: 4
  anchor_num: 256
  mask_degree_max: 3
  sh_degree_max: 2
  sample_phi_num: 8
  sample_theta_num: 8

loss_cfg:
  lambda_collision: 0.00001  # Weight for collision loss (further reduced: 0.001 -> 0.00001 to prevent gradient explosion)
  include_self_intersection: true  # Whether to include hand self-intersection loss
  guidance_scale: 1.0
  guidance_threshold: 0.0
  use_spherical_gaussian: true  # Whether to use spherical Gaussian constraint
  use_multiprocessing: true  # Use multiprocessing for collision detection (fork-safe in DDP, pure CPU operations)
  num_workers: 8  # Number of worker processes for collision detection
  collision_timestep_threshold: 200  # Only compute collision loss when t < this threshold (pred_x0 is more accurate at small t)
  
  # Collision loss type: "fcl" (OBB + FCL broadphase) or "dexgrasp" (KNN-based ERF+SPF+SRF)
  loss_type: "dexgrasp"
  
  # DexGrasp-style loss weights (only used when loss_type="dexgrasp")
  # Note: These are relative weights WITHIN collision loss, lambda_collision scales the total
  erf_weight: 0.001  # ERF loss weight (hand-object penetration)
  cmap_loss_weight: 0.0001  # Contact Map Alignment loss weight (reduced from 0.001, raw CMAP loss ~0.47-0.49 is WAY too large)
  srf_weight: 0.001  # SRF loss weight (hand self-collision, 0.001)
  srf_threshold: 0.02  # SRF distance threshold (meters)
  srf_k_neighbors: 10  # Number of nearest neighbors for SRF computation (KNN-based, memory efficient)

# Edge Weight VAE configuration (optional)
# Set checkpoint_path when VAE is trained
edge_vae_cfg:
  checkpoint_path: null  # e.g., /path/to/edge_vae.ckpt
  input_dim: 22
  n_anchors: 256
  d_model: 128
  nhead: 4
  num_encoder_layers: 4
  latent_dim: 64
  pos_dim: 64
  phys_dim: 3                         # For RoPE positional encoding
  dropout: 0.1
  # Two-stage decoder config
  row_hidden_dims: [128, 64]          # Stage 1: Column classifier (hand patches)
  col_hidden_dims: [256, 128, 64]     # Stage 2: Row predictor (object patches)

trainer:
  fast_dev_run: False
  max_epochs: 300
  log_dir: /home/yxz/MyProjects/MASH-HOI/mash_hoi/runs
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"  # Clip by global norm
  devices: [0,1,2,3,4,5,6,7]
  limit_test_batches: 1.0
  precision: "32"
  check_val_every_n_epoch: 2000
  detect_anomaly: true  # Enable anomaly detection to catch NaN/Inf early

tester:
  devices: [0]
  # ckpt_path: /mnt/d/yxz/lym29-data/MASH-HOI/runs/exp_ddpm_graph_dro_no_edgevae/version_10/best_model.ckpt

